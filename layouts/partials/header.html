<header class="header">
    <div class="header__inner">
        <div class="header__left">
        {{ partial "logo.html" . }}
        </div>

        {{ if (eq .Site.Params.Search.Enable true) }}
        <div class="header__mid">
        <a class="button" href="{{ "search" | relLangURL }}">
            <span class="button__text">Search</span>
        </a>
        </div>
       {{ end }}

        <div class="header__right">
            {{ if len .Site.Menus }}
                {{ partial "menu.html" . }}
            <button id="toggleMenu" type="button" aria-expanded="false" aria-controls="menu" aria-label="Toggle menu">
                <div class="menu-trigger">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M0 0h24v24H0z" fill="none"/>
                        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                    </svg>
                </div>
             </button>
            {{ end }}

            <button class="theme-toggle" id="toggleTheme" aria-label="Toggle theme">{{ partial "theme-icon.html" . }}</button>
        </div>
    </div>
</header>
